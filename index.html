function toast(message,type="info"){
    const box=document.createElement("div");
    const color=type==="error"?"bg-red-500":type==="success"?"bg-green-500":"bg-blue-500";
    box.className=`toast ${color} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 font-bold`;
    box.innerHTML=`<i class="fas ${type==="error"?"fa-circle-exclamation":type==="success"?"fa-circle-check":"fa-circle-info"}"></i><span>${escapeHtml(message)}</span>`;
    document.getElementById("toast-container").appendChild(box);
    setTimeout(()=>box.remove(),3500);
}

function escapeHtml(value){
    return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function uid(){

async function initFirebase(){
    try{
        firebaseApp=initializeApp(firebaseConfig);
        auth=getAuth(firebaseApp);
        db=getFirestore(firebaseApp);

        await signInAnonymously(auth);

        await new Promise((resolve,reject)=>{
            let finished=false;
            const done=(fn,arg)=>{
                if(finished) return;
                finished=true;
                try { unsub && unsub(); } catch(e){}
                fn(arg);
            };
            let unsub=null;

            unsub=onAuthStateChanged(auth,user=>{
                if(user){
                    STATE.user.id=user.uid;
                    firebaseReady=true;
                    done(resolve);
                }
            },error=>done(reject,error));

            setTimeout(()=>done(reject,new Error("Tempo excedido ao autenticar no Firebase.")),10000);
        });
    }catch(error){
        console.error("Firebase:",error);
        firebaseReady=false;
        STATE.firebaseError=error;
        showFirebaseError(error);
        return;
    }
    render();
}

        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-7 text-center">
            <h2 class="title-font text-3xl mb-2">Entrar na Sala</h2>
            <p class="text-slate-500 mb-6">Digite o código de 4 caracteres.</p>
            <input id="room-code" maxlength="4" autocomplete="off"
                class="w-full p-5 rounded-2xl border-2 border-slate-300 text-center text-4xl font-black tracking-[.35em] uppercase outline-none focus:border-indigo-500 mb-5"
                placeholder="ABCD">
            <button id="submit-join" class="w-full py-4 rounded-xl bg-pink-500 hover:bg-pink-600 text-white text-xl font-bold">
                Entrar
            </button>
        </div>
    </section>`;
}

function lobby(){
    const room=STATE.room;
    const me=room.players.find(p=>p.id===STATE.user.id);
    const isHost=room.hostId===STATE.user.id;
    const used=room.players.map(p=>p.color).filter(Boolean);

    const players=room.players.map(p=>`
        <div class="flex items-center justify-between bg-slate-50 border rounded-xl p-3">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full peao-${p.color||"branco"} border-2 border-white shadow"></div>
                <div>
                    <div class="font-bold">${escapeHtml(p.name)} ${p.id===STATE.user.id?"(Você)":""} ${p.id===room.hostId?'<i class="fas fa-crown text-yellow-500 ml-1"></i>':""}</div>
                    <div class="text-xs ${p.color?"text-green-600":"text-orange-500"}">${p.color?"Pronto":"Escolhendo peão..."}</div>
                </div>
            </div>
        </div>
    `).join("");

    let empty="";
    for(let i=room.players.length;i<room.maxPlayers;i++){
        empty+=`<div class="border border-dashed rounded-xl p-4 text-center text-slate-400"><i class="fas fa-user-plus mr-2"></i>Aguardando jogador...</div>`;
    }

    const allReady=room.players.length>=2 && room.players.every(p=>p.color);

    return `
    <section class="screen flex flex-col">
        <div class="bg-indigo-50 border-b p-5 flex items-center justify-between">
            <div>
                <h2 class="title-font text-3xl text-indigo-900">Sala de Espera</h2>
                <div class="text-sm text-indigo-700 mt-1">Código:
                    <strong class="text-xl bg-indigo-200 px-3 py-1 rounded-lg select-all">${room.id}</strong>
                </div>
            </div>
            <button id="leave-room" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg font-bold">Sair</button>
        </div>

        <div class="flex-1 p-6 grid md:grid-cols-3 gap-6 overflow-y-auto">
            <div class="md:col-span-2 bg-white rounded-2xl shadow p-5">
                <h3 class="font-bold text-xl border-b pb-3 mb-4">Jogadores (${room.players.length}/${room.maxPlayers})</h3>
                <div class="space-y-2">${players}${empty}</div>

                ${me?`
                <div class="mt-6 border-t pt-5">
                    <h3 class="font-bold mb-3">Escolha seu peão</h3>
                    <div class="flex flex-wrap gap-3 justify-center">
                        ${PAWN_COLORS.map(c=>{
                            const mine=me.color===c.id;
                            const unavailable=used.includes(c.id)&&!mine;
                            return `<button class="choose-color w-11 h-11 rounded-full peao-${c.id} shadow ${mine?"ring-4 ring-indigo-500 ring-offset-2":""} ${unavailable?"opacity-25 cursor-not-allowed":""}" data-color="${c.id}" ${unavailable?"disabled":""} title="${c.name}"></button>`;
                        }).join("")}
                    </div>
                </div>`:""}
            </div>

            <div class="bg-slate-100 rounded-2xl border p-5 flex flex-col justify-center">
                <h3 class="font-bold text-xl mb-4">Regras</h3>
                <ul class="space-y-2 text-sm text-slate-600 mb-6">
                    <li><i class="fas fa-check text-green-500 mr-2"></i>${room.boardSize} casas</li>
                    <li><i class="fas fa-check text-green-500 mr-2"></i>60 segundos por pergunta</li>
                    <li><i class="fas fa-check text-green-500 mr-2"></i>Acertou: avança o número do dado</li>
                    <li><i class="fas fa-check text-green-500 mr-2"></i>Vence quem chegar ao fim</li>
                </ul>
                ${isHost?`
                    <button id="start-game" ${allReady?"":"disabled"} class="w-full py-4 rounded-xl ${allReady?"bg-green-500 hover:bg-green-600":"bg-slate-300 cursor-not-allowed"} text-white text-lg font-bold">
                        ${allReady?"Iniciar Jogo":"Aguardando jogadores..."}
                    </button>`:
                    `<div class="bg-yellow-100 text-yellow-800 rounded-xl p-4 text-center font-bold">Aguardando o líder iniciar o jogo.</div>`}
            </div>
        </div>
    </section>`;
}

function game(){
    const room=STATE.room;
    const current=room.players[room.turnIndex];
    const isMyTurn=STATE.mode==="offline" || current.id===STATE.user.id;

    let board="";
    for(let i=1;i<=room.boardSize;i++){
        const cat=CATEGORIES[(i-1)%CATEGORIES.length];
        const here=room.players.filter(p=>p.position===i);
        board+=`
        <div class="relative w-16 h-16 sm:w-20 sm:h-20 flex-shrink-0 rounded-xl ${cat.colorClass} border-2 border-white shadow board-space flex items-center justify-center">
            <span class="font-black text-xl opacity-60">${i}</span>
            ${i===1?'<span class="absolute -top-2 -left-1 text-[10px] bg-black text-white px-1 rounded">INÍCIO</span>':""}
            ${i===room.boardSize?'<span class="absolute -bottom-2 -right-1 text-[10px] bg-yellow-300 text-black px-1 rounded font-bold">FIM</span>':""}
            <div class="absolute bottom-1 right-1 opacity-30"><i class="fas ${cat.icon}"></i></div>
            <div class="absolute inset-0 flex flex-wrap items-center justify-center gap-1 p-2">
                ${here.map(p=>`<div class="w-5 h-5 rounded-full peao-${p.color} border-2 border-white shadow" title="${escapeHtml(p.name)}"></div>`).join("")}
            </div>
        </div>`;
    }

    const score=room.players.map((p,i)=>{
        const turn=i===room.turnIndex;
        return `<div class="min-w-[180px] flex items-center gap-2 p-2 rounded-xl ${turn?"bg-indigo-100 ring-2 ring-indigo-400":"bg-white border"}">
            <div class="w-9 h-9 rounded-full peao-${p.color} flex items-center justify-center text-white font-black">${p.position}</div>
            <div><div class="font-bold text-sm">${escapeHtml(p.name)} ${turn?'<span class="text-indigo-500">(vez)</span>':""}</div><div class="text-xs text-slate-500">${p.score} pontos</div></div>
        </div>`;
    }).join("");

    let action="";
    if(room.currentAction==="waiting"){
        action=isMyTurn?`<button id="roll-dice" class="px-9 py-4 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-2xl text-2xl font-bold shadow-xl hover:scale-105 transition"><i class="fas fa-dice mr-2"></i>Rolar Dado</button>`:`<div class="text-slate-500 font-bold">Aguardando a vez de <strong>${escapeHtml(current.name)}</strong>...</div>`;
    }else if(room.currentAction==="rolling"){
        action=`<div class="text-center"><i class="fas fa-dice text-6xl text-indigo-500 dice-anim"></i><div class="font-bold mt-2">Rolando...</div></div>`;
    }else if(room.currentAction==="answering"){
        action=`<div class="text-center font-bold text-slate-600">${isMyTurn?"Sua vez de responder!":`Aguardando ${escapeHtml(current.name)} responder...`}</div>`;
    }else{
        action=`<div class="text-slate-500">Processando jogada...</div>`;
    }

    return `
    <section class="screen flex flex-col">
        <div class="bg-white p-3 border-b shadow-sm overflow-x-auto">
            <div class="flex gap-3 justify-center">${score}</div>
        </div>

        <div class="flex-1 overflow-auto p-5 bg-slate-100">
            <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-inner border p-4">
                <div class="flex flex-wrap gap-2 justify-center">
                    <div class="w-20 h-20 rounded-full bg-slate-200 border-4 border-slate-300 flex items-center justify-center font-bold text-slate-500 relative">
                        SAÍDA
                        <div class="absolute inset-0 flex items-center justify-center gap-1 flex-wrap p-2">
                            ${room.players.filter(p=>p.position===0).map(p=>`<div class="w-5 h-5 rounded-full peao-${p.color} border-2 border-white"></div>`).join("")}
                        </div>
                    </div>
                    <div class="w-full flex flex-wrap justify-center gap-2 mt-3">${board}</div>
                </div>
            </div>
        </div>

        <div class="bg-white p-5 shadow-[0_-5px_12px_rgba(0,0,0,.08)] min-h-[110px] flex items-center justify-center">
            ${action}
        </div>
    </section>`;
}

function gameOver(){
    const sorted=[...STATE.room.players].sort((a,b)=>b.position-a.position||b.score-a.score);
    const winner=STATE.room.players.find(p=>p.id===STATE.room.winnerId)||sorted[0];

    return `
    <section class="screen flex flex-col items-center justify-center p-5 overflow-y-auto">
        <i class="fas fa-trophy text-7xl text-yellow-400 mb-4"></i>
        <h1 class="title-font text-5xl mb-2">Fim de Jogo!</h1>
        <p class="text-xl text-slate-600 mb-7"><strong>${escapeHtml(winner.name)}</strong> venceu!</p>

        <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl p-6">
            <h2 class="font-bold text-xl border-b pb-3 mb-4">Ranking Final</h2>
            ${sorted.map((p,i)=>`
                <div class="flex items-center justify-between p-4 rounded-xl mb-2 ${i===0?"bg-yellow-50 ring-2 ring-yellow-400":"bg-slate-50"}">
                    <div class="flex items-center gap-3">
                        <span class="font-black text-xl w-8">${i+1}º</span>
                        <span class="w-10 h-10 rounded-full peao-${p.color} border-2 border-white shadow"></span>
                        <strong>${escapeHtml(p.name)}</strong>
                    </div>
                    <div class="text-right"><strong class="text-indigo-600">${p.score} pts</strong><div class="text-xs text-slate-500">Casa ${p.position}</div></div>
                </div>`).join("")}
            <button id="back-after-game" class="w-full py-4 mt-4 bg-slate-800 text-white rounded-xl font-bold">Voltar ao Menu</button>
        </div>
    </section>`;
}

function showQuestion(){
    const q=STATE.room.currentQuestion;
    if(!q)return;
    const current=STATE.room.players[STATE.room.turnIndex];
    const myTurn=STATE.mode==="offline"||current.id===STATE.user.id;
    const elapsed=Math.floor((Date.now()-q.startTime)/1000);
    const left=Math.max(0,60-elapsed);

    const content=myTurn?`
        <div class="space-y-3 mt-6">
            ${q.data.options.map((o,i)=>`
                <button class="answer-option w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 font-bold transition" data-answer="${i}">
                    ${String.fromCharCode(65+i)}. ${escapeHtml(o)}
                </button>`).join("")}
        </div>`:
        `<div class="mt-8 text-center text-slate-500"><i class="fas fa-hourglass-half text-5xl opacity-40 animate-pulse"></i><p class="mt-3">Aguardando <strong>${escapeHtml(current.name)}</strong> responder...</p></div>`;

    document.getElementById("modal-container").innerHTML=`
    <div class="modal-backdrop">
        <div class="bg-white w-full max-w-xl rounded-3xl overflow-hidden shadow-2xl">
            <div class="${q.category.colorClass} p-6 text-center relative">
                <div class="absolute right-4 top-4 bg-white/20 px-3 py-1 rounded-full font-bold"><i class="fas fa-dice mr-1"></i>${STATE.room.diceValue}</div>
                <i class="fas ${q.category.icon} text-4xl"></i>
                <h2 class="title-font text-3xl uppercase">${q.category.name}</h2>
            </div>
            <div class="p-7">
                <div id="question-timer" class="text-center text-4xl font-black font-mono mb-5 ${left>20?"text-green-500":left>10?"text-orange-500":"text-red-500"}">00:${String(left).padStart(2,"0")}</div>
                <h3 class="text-xl sm:text-2xl font-black text-center leading-snug">${escapeHtml(q.data.q)}</h3>
                ${content}
            </div>
        </div>
    </div>`;
    document.getElementById("modal-container").classList.remove("hidden");
    bindQuestionTimer();
}

function showResult(correct,dice){
    document.getElementById("modal-container").innerHTML=`
    <div class="modal-backdrop">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl">
            <div class="w-24 h-24 rounded-full ${correct?"bg-green-100":"bg-red-100"} flex items-center justify-center mx-auto mb-5">
                <i class="fas ${correct?"fa-check text-green-500":"fa-times text-red-500"} text-5xl"></i>
            </div>
            <h2 class="title-font text-4xl">${correct?"Correto!":"Incorreto!"}</h2>
            <p class="text-lg text-slate-600 mt-2">${correct?`Avançou <strong>${dice}</strong> casas.`:"Não avançou nesta rodada."}</p>
        </div>
    </div>`;
    document.getElementById("modal-container").classList.remove("hidden");
}

function hideModal(){
    const m=document.getElementById("modal-container");
    m.classList.add("hidden");
    m.innerHTML="";
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    if(answerTimeout){clearTimeout(answerTimeout);answerTimeout=null;}
}

function bindQuestionTimer(){
    if(timerInterval)clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
        if(!STATE.room?.currentQuestion){clearInterval(timerInterval);return;}
        const left=Math.max(0,60-Math.floor((Date.now()-STATE.room.currentQuestion.startTime)/1000));
        const el=document.getElementById("question-timer");
        if(el)el.textContent=`00:${String(left).padStart(2,"0")}`;
        if(left<=0){
            clearInterval(timerInterval);
            const current=STATE.room.players[STATE.room.turnIndex];
            if(STATE.mode==="offline"||current.id===STATE.user.id) answer(-1);
        }
    },500);
}

function bind(){
    const name=document.getElementById("player-name");
    if(name){
        name.addEventListener("change",()=>STATE.user.name=name.value.trim()||"Jogador");
        name.addEventListener("input",()=>STATE.user.name=name.value);
    }

    document.getElementById("go-online")?.addEventListener("click",()=>{
        STATE.mode="online";STATE.view="online_menu";render();
    });
    document.getElementById("go-offline")?.addEventListener("click",()=>{
        STATE.mode="offline";STATE.view="create_room";render();
    });
    document.getElementById("back-menu")?.addEventListener("click",()=>{STATE.view="menu";render();});
    document.getElementById("back-online")?.addEventListener("click",()=>{STATE.view="online_menu";render();});
    document.getElementById("back-online2")?.addEventListener("click",()=>{STATE.view="online_menu";render();});

    document.getElementById("create-online")?.addEventListener("click",()=>{STATE.mode="online";STATE.view="create_room";render();});
    document.getElementById("join-online")?.addEventListener("click",()=>{STATE.mode="online";STATE.view="join_room";render();});

    const max=document.getElementById("max-players");
    if(max&&STATE.mode==="offline") renderOfflineNames();

    max?.addEventListener("change",()=>{if(STATE.mode==="offline")renderOfflineNames();});

    document.getElementById("submit-create")?.addEventListener("click",async()=>{
        if(STATE.mode==="offline") await createOffline();
        else await createOnline();
    });

    const join=document.getElementById("submit-join");
    const code=document.getElementById("room-code");
    if(join&&code){
        join.addEventListener("click",()=>joinOnline(code.value));
        code.addEventListener("input",()=>code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,""));
        code.addEventListener("keydown",e=>{if(e.key==="Enter")joinOnline(code.value);});
    }

    document.getElementById("leave-room")?.addEventListener("click",leaveRoom);
    document.querySelectorAll(".choose-color").forEach(btn=>btn.addEventListener("click",()=>chooseColor(btn.dataset.color)));
    document.getElementById("start-game")?.addEventListener("click",startGame);
    document.getElementById("roll-dice")?.addEventListener("click",rollDice);
    document.getElementById("back-after-game")?.addEventListener("click",leaveRoom);

    if(STATE.view==="game"&&STATE.room?.currentQuestion)showQuestion();
}

function renderOfflineNames(){
    const container=document.getElementById("offline-names");
    const n=parseInt(document.getElementById("max-players").value);
    container.innerHTML=`<label class="block font-bold mb-3">Nomes dos jogadores</label>`+
        Array.from({length:n},(_,i)=>`<input id="off-${i}" class="w-full p-3 border rounded-xl mb-2" value="${i===0?escapeHtml(STATE.user.name):`Jogador ${i+1}`}" placeholder="Jogador ${i+1}">`).join("");
}

async function createOffline(){
    const n=parseInt(document.getElementById("max-players").value);
    const players=[];
    for(let i=0;i<n;i++){
        players.push({
            id:`offline-${i}`,name:document.getElementById(`off-${i}`).value.trim()||`Jogador ${i+1}`,
            color:PAWN_COLORS[i].id,position:0,score:0
        });
    }
    STATE.room={
        id:"LOCAL",status:"playing",hostId:players[0].id,boardSize:parseInt(document.getElementById("board-size").value),
        maxPlayers:n,players,turnIndex:0,currentAction:"waiting",diceValue:null,currentQuestion:null,
        usedQuestions:emptyUsed(),winnerId:null
    };
    STATE.user.id=players[0].id;
    STATE.view="game";
    render();
}

async function createOnline(){
    if(!firebaseReady||!db){toast("Firebase ainda não está conectado.","error");return;}
    const button=document.getElementById("submit-create");
    button.disabled=true;
    button.innerHTML=`<span class="loader inline-block mr-2 align-middle"></span>Criando...`;

    try{
        let id=roomCode();
        let existing=await getDoc(roomRef(id));
        while(existing.exists()){
            id=roomCode();
            existing=await getDoc(roomRef(id));
        }

        const player={
            id:STATE.user.id,name:STATE.user.name.trim()||"Jogador",color:"azul",position:0,score:0
        };
        const data={
            id,status:"lobby",hostId:STATE.user.id,
            boardSize:parseInt(document.getElementById("board-size").value),
            maxPlayers:parseInt(document.getElementById("max-players").value),
            players:[player],turnIndex:0,currentAction:"waiting",diceValue:null,
            currentQuestion:null,usedQuestions:emptyUsed(),winnerId:null,lastAnswerCorrect:null,
            updatedAt:Date.now()
        };

        await setDoc(roomRef(id),data);
        await watchRoom(id);
    }catch(error){
        console.error(error);
        toast(`Não foi possível criar a sala: ${friendlyFirebaseError(error)}`,"error");
        button.disabled=false;button.textContent="Criar Sala";
    }
}

async function joinOnline(rawCode){
    const id=String(rawCode).trim().toUpperCase();
    if(id.length!==4){toast("Digite exatamente 4 caracteres.","error");return;}
    if(!firebaseReady||!db){toast("Firebase ainda não está conectado.","error");return;}

    const button=document.getElementById("submit-join");
    button.disabled=true;button.textContent="Entrando...";

    try{
        const ref=roomRef(id);
        const snap=await getDoc(ref);
        if(!snap.exists()){toast("Sala não encontrada.","error");button.disabled=false;button.textContent="Entrar";return;}

        const room=snap.data();
        if(room.status!=="lobby"){toast("Esta partida já começou.","error");button.disabled=false;button.textContent="Entrar";return;}
        if(room.players.length>=room.maxPlayers){toast("A sala está cheia.","error");button.disabled=false;button.textContent="Entrar";return;}

        if(!room.players.some(p=>p.id===STATE.user.id)){
            const used=room.players.map(p=>p.color).filter(Boolean);
            const free=PAWN_COLORS.find(c=>!used.includes(c.id));
            room.players.push({
                id:STATE.user.id,name:STATE.user.name.trim()||"Jogador",
                color:free?free.id:null,position:0,score:0
            });
            await updateDoc(ref,{players:room.players,updatedAt:Date.now()});
        }
        await watchRoom(id);
    }catch(error){
        console.error(error);
        toast(`Não foi possível entrar: ${friendlyFirebaseError(error)}`,"error");
        button.disabled=false;button.textContent="Entrar";
    }
}

async function watchRoom(id){
    if(unsubscribeRoom)unsubscribeRoom();
    unsubscribeRoom=onSnapshot(roomRef(id),snap=>{
        if(!snap.exists()){
            toast("A sala foi encerrada.","error");
            STATE.room=null;STATE.view="online_menu";render();
            return;
        }
        const room=snap.data();
        STATE.room=room;
        if(room.status==="playing")STATE.view="game";
        else if(room.status==="finished")STATE.view="game_over";
        else STATE.view="lobby";
        render();
    },error=>{
        console.error(error);
        toast(`Erro de sincronização: ${friendlyFirebaseError(error)}`,"error");
    });
}

async function chooseColor(color){
    if(!STATE.room)return;
    const used=STATE.room.players.some(p=>p.id!==STATE.user.id&&p.color===color);
    if(used){toast("Esse peão já está sendo usado.","error");return;}

    const players=STATE.room.players.map(p=>p.id===STATE.user.id?{...p,color}:p);
    if(STATE.mode==="offline"){STATE.room.players=players;render();return;}
    try{await updateDoc(roomRef(STATE.room.id),{players,updatedAt:Date.now()});}
    catch(e){toast(friendlyFirebaseError(e),"error");}
}

async function startGame(){
    if(!STATE.room)return;
    if(STATE.mode==="offline"){
        STATE.room.status="playing";STATE.room.currentAction="waiting";STATE.view="game";render();return;
    }
    if(STATE.room.players.length<2||!STATE.room.players.every(p=>p.color)){toast("Todos os jogadores precisam escolher um peão.","error");return;}
    try{
        await updateDoc(roomRef(STATE.room.id),{status:"playing",turnIndex:0,currentAction:"waiting",updatedAt:Date.now()});
    }catch(e){toast(friendlyFirebaseError(e),"error");}
}

function pickQuestion(categoryId,used){
    const list=QUESTIONS[categoryId];
    let available=list.map((_,i)=>i).filter(i=>!(used||[]).includes(i));
    if(!available.length){available=list.map((_,i)=>i);used=[];}
    const index=available[Math.floor(Math.random()*available.length)];
    return {index,data:{q:list[index][0],options:list[index][1],a:list[index][2]}};
}

async function rollDice(){
    const room=STATE.room;
    if(!room)return;
    const current=room.players[room.turnIndex];
    if(current.id!==STATE.user.id&&STATE.mode==="online")return;
    if(room.currentAction!=="waiting")return;

    if(STATE.mode==="offline"){
        room.currentAction="rolling";render();
        setTimeout(()=>offlineRoll(),700);
        return;
    }

    try{
        await updateDoc(roomRef(room.id),{currentAction:"rolling",updatedAt:Date.now()});
        setTimeout(()=>onlineRoll(room.id),800);
    }catch(e){toast(friendlyFirebaseError(e),"error");}
}

async function onlineRoll(id){
    try{
        const snap=await getDoc(roomRef(id));
        if(!snap.exists())return;
        const room=snap.data();
        if(room.currentAction!=="rolling")return;

        const dice=Math.floor(Math.random()*6)+1;
        const current=room.players[room.turnIndex];
        const target=Math.min(current.position+dice,room.boardSize);
        const category=CATEGORIES[(target-1)%CATEGORIES.length];
        const used={...emptyUsed(),...(room.usedQuestions||{})};
        const pick=pickQuestion(category.id,used[category.id]||[]);
        used[category.id]=[...(used[category.id]||[]),pick.index];

        await updateDoc(roomRef(id),{
            diceValue:dice,currentAction:"answering",
            currentQuestion:{category,data:pick.data,startTime:Date.now()},
            usedQuestions:used,updatedAt:Date.now()
        });
    }catch(e){toast(friendlyFirebaseError(e),"error");}
}

function offlineRoll(){
    const room=STATE.room;
    const dice=Math.floor(Math.random()*6)+1;
    const current=room.players[room.turnIndex];
    const target=Math.min(current.position+dice,room.boardSize);
    const category=CATEGORIES[(target-1)%CATEGORIES.length];
    const used=room.usedQuestions||emptyUsed();
    const pick=pickQuestion(category.id,used[category.id]||[]);
    used[category.id]=[...(used[category.id]||[]),pick.index];
    room.diceValue=dice;
    room.currentQuestion={category,data:pick.data,startTime:Date.now()};
    room.currentAction="answering";
    render();
}

async function answer(index){
    const room=STATE.room;
    if(!room?.currentQuestion)return;
    const current=room.players[room.turnIndex];
    if(current.id!==STATE.user.id&&STATE.mode==="online")return;

    const correct=index===room.currentQuestion.data.a;
    const players=room.players.map(p=>({...p}));
    const p=players[room.turnIndex];

    if(correct){
        p.position=Math.min(p.position+room.diceValue,room.boardSize);
        p.score+=10;
    }

    const finished=p.position>=room.boardSize;
    const nextTurn=(room.turnIndex+1)%players.length;
    const result={
        players,currentQuestion:null,diceValue:null,
        status:finished?"finished":"playing",
        winnerId:finished?p.id:null,
        turnIndex:finished?room.turnIndex:nextTurn,
        currentAction:"moving",
        lastAnswerCorrect:correct,updatedAt:Date.now()
    };

    if(STATE.mode==="offline"){
        room.players=players;
        room.status=result.status;
        room.winnerId=result.winnerId;
        room.turnIndex=result.turnIndex;
        room.currentAction=result.currentAction;
        room.currentQuestion=null;
        room.lastAnswerCorrect=correct;
        showResult(correct,room.diceValue);
        setTimeout(()=>{
            if(room.status==="finished"){hideModal();STATE.view="game_over";render();}
            else{room.currentAction="waiting";room.lastAnswerCorrect=null;render();}
        },1800);
        return;
    }

    try{
        await updateDoc(roomRef(room.id),result);
        setTimeout(async()=>{
            try{
                const s=await getDoc(roomRef(room.id));
                if(s.exists()&&s.data().currentAction==="moving"&&s.data().status==="playing"){
                    await updateDoc(roomRef(room.id),{currentAction:"waiting",lastAnswerCorrect:null,updatedAt:Date.now()});
                }
            }catch(e){console.error(e);}
        },1800);
    }catch(e){toast(friendlyFirebaseError(e),"error");}
}

async function leaveRoom(){
    if(timerInterval)clearInterval(timerInterval);
    if(unsubscribeRoom){unsubscribeRoom();unsubscribeRoom=null;}

    if(STATE.mode==="online"&&STATE.room&&db){
        try{
            const ref=roomRef(STATE.room.id);
            const snap=await getDoc(ref);
            if(snap.exists()){
                const room=snap.data();
                const remaining=room.players.filter(p=>p.id!==STATE.user.id);
                if(!remaining.length)await deleteDoc(ref);
                else{
                    let hostId=room.hostId;
                    if(hostId===STATE.user.id)hostId=remaining[0].id;
                    await updateDoc(ref,{players:remaining,hostId,updatedAt:Date.now()});
                }
            }
        }catch(e){console.error(e);}
    }

    STATE.room=null;
    STATE.view=STATE.mode==="offline"?"menu":"online_menu";
    STATE.mode=null;
    render();
}

function friendlyFirebaseError(error){
    const code=error?.code||"";
    const map={
        "permission-denied":"Permissão negada pelo Firestore. Verifique as regras.",
        "auth/operation-not-allowed":"Login anônimo não está ativado no Firebase.",
        "auth/unauthorized-domain":"O domínio do GitHub Pages não está autorizado.",
        "unavailable":"Firebase temporariamente indisponível.",
        "failed-precondition":"O Firestore não está disponível/configurado corretamente."
    };
    return map[code]||error?.message||"Erro desconhecido.";
}

/* Inicialização */
render();
initFirebase();
</script>
